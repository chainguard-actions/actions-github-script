name: Test previews input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          previews: "ant-man-preview,squirrel-girl-preview"
          result-encoding: string
          script: |
            return "previews-ok"
      - name: Assert result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "previews-ok" ]; then
            echo "FAIL: expected 'previews-ok' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
