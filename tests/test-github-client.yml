name: Test GitHub client availability
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: |
            // Verify the github client object is available and has expected shape
            if (typeof github !== 'object' || github === null) {
              throw new Error('github client is not an object');
            }
            // @actions/github v4 exposes methods directly (e.g. github.repos, github.issues)
            // rather than via github.rest (which came in v5+)
            if (typeof github.repos !== 'object' && typeof github.rest !== 'object') {
              throw new Error('github client has no repos or rest property');
            }
            return 'github-client-ok';
          result-encoding: string
      - name: Assert github client is available
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTUAL" != "github-client-ok" ]; then
              echo "FAIL: expected 'github-client-ok' but got '$ACTUAL'"
              exit 1
            fi
            echo "PASS: github client is available"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
