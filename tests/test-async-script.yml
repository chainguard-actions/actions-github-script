name: Test async script execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          result-encoding: string
          script: |
            // Scripts run in an async context, so await is available
            const result = await Promise.resolve('async-result');
            return result;
      - name: Assert async result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "async-result" ]; then
            echo "FAIL: expected 'async-result', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
