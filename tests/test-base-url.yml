name: Test base-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          base-url: https://api.github.com
          script: |
            return "base-url-ok"
          result-encoding: string
      - name: Assert result
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "base-url-ok" ]; then
            echo "FAIL: expected 'base-url-ok', got '$RESULT'"
            exit 1
          fi
          echo "PASS"
