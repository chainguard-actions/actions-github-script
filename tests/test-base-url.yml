name: Test script with base-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: return 'custom-base-url-test'
          base-url: https://api.github.com
          result-encoding: string
      - name: Assert result output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "custom-base-url-test" ]; then
            echo "FAIL: expected 'custom-base-url-test', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
