name: Test retries configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: return "retries-ok"
          result-encoding: string
          retries: "2"
      - name: Assert output with retries configured
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "retries-ok" ]; then
            echo "FAIL: expected 'retries-ok' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
