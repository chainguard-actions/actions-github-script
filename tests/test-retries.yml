name: Test retries input accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: return "ok"
          result-encoding: string
          retries: "3"
          retry-exempt-status-codes: "400,401,403,404,422"
      - name: Assert result is ok
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "ok" ]; then
            echo "FAIL: expected 'ok' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
