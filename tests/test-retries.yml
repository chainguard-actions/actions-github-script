name: Test retries input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          retries: "3"
          retry-exempt-status-codes: "400,401,403,404,422"
          script: |
            return "retries-configured"
          result-encoding: string
      - name: Assert script ran with retries configured
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" = "retries-configured" ]; then
            echo "PASS: script ran successfully with retries configured"
          else
            echo "FAIL: expected 'retries-configured', got: $RESULT"
            exit 1
          fi
