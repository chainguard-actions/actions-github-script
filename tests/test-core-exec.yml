name: Test core and exec usage in script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: |
            core.info("Running test script");
            const result = await exec.getExecOutput("echo", ["hello"]);
            return result.stdout.trim();
          result-encoding: string
      - name: Assert exec output is hello
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello" ]; then
            echo "FAIL: expected 'hello' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
