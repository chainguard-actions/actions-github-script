name: Test require of Node.js built-in module in script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: |
            const os = require('os');
            const platform = os.platform();
            core.info(`Platform: ${platform}`);
            return platform
          result-encoding: string
      - name: Assert platform is linux
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "linux" ]; then
            echo "FAIL: expected 'linux' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
