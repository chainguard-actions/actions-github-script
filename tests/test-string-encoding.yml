name: Test string result encoding
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          script: |
            return "hello from github-script"
          result-encoding: string
      - name: Assert string output
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" = "hello from github-script" ]; then
            echo "PASS: result matches expected string"
          else
            echo "FAIL: expected 'hello from github-script', got: $RESULT"
            exit 1
          fi
