name: Test previews input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          previews: "starfox-preview,shadow-cat-preview"
          script: |
            return "previews-ok"
          result-encoding: string
      - name: Assert result
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "previews-ok" ]; then
            echo "FAIL: expected 'previews-ok' but got '$RESULT'"
            exit 1
          fi
          echo "PASS"
