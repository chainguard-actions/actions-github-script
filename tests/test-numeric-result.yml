name: Test numeric JSON result
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          result-encoding: json
          script: |
            const a = 6;
            const b = 7;
            return a * b;
      - name: Assert numeric result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "42" ]; then
            echo "FAIL: expected '42', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
