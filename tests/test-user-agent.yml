name: Test custom user-agent input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: return "user-agent-ok"
          result-encoding: string
          user-agent: "my-custom-agent/1.0"
      - name: Assert output with custom user-agent
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "user-agent-ok" ]; then
            echo "FAIL: expected 'user-agent-ok' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
