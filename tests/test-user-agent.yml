name: Test custom user-agent
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: return "custom-ua-ok"
          result-encoding: string
          user-agent: my-custom-agent/1.0
      - name: Assert output with custom user-agent
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "custom-ua-ok" ]; then
            echo "FAIL: expected 'custom-ua-ok' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
