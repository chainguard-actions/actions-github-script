name: Test GitHub API access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: |
            const { data: rateLimit } = await github.rest.rateLimit.get();
            const remaining = rateLimit.rate.remaining;
            core.info(`Rate limit remaining: ${remaining}`);
            return remaining;
          result-encoding: json
      - name: Assert rate limit call succeeded or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but result is empty"
              exit 1
            fi
            echo "PASS: got rate limit remaining=$ACTUAL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
