name: Test GitHub API call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          script: |
            // Use a public API endpoint that doesn't depend on the sentinel repo
            const { data: user } = await github.rest.users.getAuthenticated();
            core.info(`Authenticated as: ${user.login}`);
            return user.login
          result-encoding: string
      - name: Assert GitHub API returned a username or failed gracefully
        env:
          RESULT: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but result is empty"
              exit 1
            fi
            echo "PASS: got authenticated username: $RESULT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (token may not support getAuthenticated)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
