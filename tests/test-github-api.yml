name: Test github API client usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: |
            const { data: user } = await github.rest.users.getAuthenticated();
            return user.login
          result-encoding: string
      - name: Assert API call result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but login is empty"
              exit 1
            fi
            echo "PASS: got login '$ACTUAL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (token may not support getAuthenticated)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
