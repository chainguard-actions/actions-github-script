name: Test JSON result encoding
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: |
            return { foo: "bar", count: 3 };
          result-encoding: json
      - name: Assert result is valid JSON with expected values
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          FOO=$(echo "$ACTUAL" | jq -r '.foo')
          COUNT=$(echo "$ACTUAL" | jq -r '.count')
          echo "foo: $FOO"
          echo "count: $COUNT"
          if [ "$FOO" != "bar" ]; then
            echo "FAIL: expected foo='bar' but got '$FOO'"
            exit 1
          fi
          if [ "$COUNT" != "3" ]; then
            echo "FAIL: expected count=3 but got '$COUNT'"
            exit 1
          fi
          echo "PASS"
