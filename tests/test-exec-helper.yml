name: Test exec helper in script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: |
            const output = [];
            await exec.exec('echo', ['exec-test'], {
              listeners: {
                stdout: (data) => { output.push(data.toString().trim()); }
              }
            });
            return output.join('');
          result-encoding: string
      - name: Assert exec output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "exec-test" ]; then
            echo "FAIL: expected 'exec-test' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
