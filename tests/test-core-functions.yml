name: Test core functions in script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: |
            core.info("Running test script");
            const value = "test-value";
            core.setOutput("custom", value);
            return value;
          result-encoding: string
      - name: Assert result from core functions
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "test-value" ]; then
            echo "FAIL: expected 'test-value' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
