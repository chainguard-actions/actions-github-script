name: Test core.setOutput in script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: |
            core.setOutput('custom-key', 'custom-value');
            core.info('Set a custom output');
            return 'done';
          result-encoding: string
      - name: Assert result from return value
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "done" ]; then
            echo "FAIL: expected 'done' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
